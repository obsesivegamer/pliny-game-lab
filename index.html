<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pliny Game Lab — Naturalis Historia</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="top-bar">
      <div class="brand">
        <span class="laurel">🏛️</span>
        <h1>PLINY GAME LAB</h1>
        <span class="subtitle">Naturalis Historia Engine Suite</span>
      </div>
      <nav id="demo-nav">
        <button class="nav-btn active" data-demo="vesuvius">🌋 Vesuvius</button>
        <button class="nav-btn" data-demo="bestiarium">🦅 Bestiarium</button>
        <button class="nav-btn" data-demo="mechanica">⚙️ Mechanica</button>
        <button class="nav-btn" data-demo="cosmographia">🪐 Cosmographia</button>
        <button class="nav-btn" data-demo="labyrinthus">⚔️ Labyrinthus</button>
      </nav>
      <div id="telemetry">
        <span class="telemetry-pill">FPS: <strong id="fps-val">60</strong></span>
        <span class="telemetry-pill">Entities: <strong id="entity-val">0</strong></span>
        <button id="fullscreen-btn" title="Toggle Fullscreen">⛶</button>
      </div>
    </header>

    <!-- Main Viewport -->
    <main id="viewport-container">
      <canvas id="main-canvas"></canvas>
      
      <!-- Interactive Floating Sidebar -->
      <aside id="controls-panel">
        <div class="panel-header">
          <h2 id="demo-title">Vesuvius Sim</h2>
          <button id="toggle-panel" aria-label="Toggle Panel">−</button>
        </div>
        <p id="demo-desc" class="demo-description">Thermodynamic falling-sand & volcanic eruption simulation.</p>
        <div id="dynamic-controls"></div>
        <div class="panel-footer">
          <button id="reset-btn" class="action-btn">Reset Simulation</button>
          <button id="pause-btn" class="action-btn">Pause</button>
        </div>
      </aside>

      <!-- Message / Help Toast -->
      <div id="hint-overlay">Click and drag to interact</div>
    </main>
  </div>

  <script type="module" src="src/core/hub.js"></script>
</body>
</html>
